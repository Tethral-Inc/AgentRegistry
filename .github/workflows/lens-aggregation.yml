name: Lens aggregation

# Manual runner for the lens rollup jobs (system_health, chain_analysis, skill
# anomaly counts, friction_baselines) — it curls the ingestion API's cron
# endpoints. All endpoints are idempotent no-ops when there's no new data, so
# running this by hand is always safe.
#
# THIS WORKFLOW NO LONGER SCHEDULES ANYTHING, on purpose.
#
# History: the schedule lived here because the repo-root vercel.json's `crons`
# never registered (the production deploy ships from packages/ingestion-api/,
# whose vercel.json had no `crons`). GitHub Actions was the plan-independent
# workaround. It cost us twice: its scheduler fires late enough under throttle
# that a */15 cron landed ~2h apart, and on 2026-07-12 commenting out the
# `schedule:` block silently froze every lens the MCP reads for 10 days while
# /health reported "cron likely stuck".
#
# Both are fixed at the root: the schedule now lives in
# packages/ingestion-api/vercel.json (where the deploy actually reads it) as a
# single daily /api/cron/daily-tick, and job_schedules (migration 000028)
# declares the expected cadence so a deliberate pause reports as `paused`
# instead of `down`. To suspend aggregation now, update the job_schedules row —
# that keeps /health and get_network_status honest. Do not re-add a `schedule:`
# here: two schedulers writing the same heartbeats makes freshness unreadable.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Endpoints to hit on manual run: "all" or space-separated names'
        default: 'all'

jobs:
  aggregate:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      INGESTION_API_URL: ${{ secrets.INGESTION_API_URL }}
      DISPATCH_JOBS: ${{ github.event.inputs.jobs }}
    steps:
      - name: Check secrets configured
        id: check
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$INGESTION_API_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CRON_SECRET or INGESTION_API_URL not set — skipping lens aggregation."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run due lens jobs
        if: steps.check.outputs.configured == 'true'
        run: |
          fail=0
          hit() {
            echo "→ $1"
            body=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $CRON_SECRET" \
              "$INGESTION_API_URL/api/cron/$1")
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            echo "  [$code] $payload"
            case "$code" in
              2*) : ;;
              *) echo "::warning::$1 returned $code"; fail=1 ;;
            esac
          }
          # Manual-only now, so "due" is just: did the operator ask for it?
          # (The schedule-routing case statement this replaced was dead code
          # once the `schedule:` triggers moved to Vercel — see header.)
          due() {
            [ "${DISPATCH_JOBS:-all}" = "all" ] && return 0
            printf ' %s ' "$DISPATCH_JOBS" | grep -q " $1 "
          }
          # Scheduling lives in packages/ingestion-api/vercel.json; this list is
          # the manual escape hatch, one name per job so an operator can re-run a
          # single lens without triggering the whole daily tick.
          for job in system-health-aggregate chain-analysis skill-threat-update friction-baseline-compute watch-evaluation pattern-detection anomaly-correlation data-archival agent-expiration; do
            if due "$job"; then hit "$job"; fi
          done
          exit $fail
