name: Lens aggregation

# Populates the lens rollup tables the MCP reads (system_health, chain_analysis,
# skill anomaly counts, friction_baselines) by curling the ingestion API's cron
# endpoints on schedule. These jobs are defined in the repo-root vercel.json as
# Vercel crons, but the production deploy ships from packages/ingestion-api/
# (whose vercel.json has no `crons`), so Vercel never registers them — driving
# them from GitHub Actions is plan-independent and matches anomaly-tick.yml.
#
# Routing is by `github.event.schedule` (the cron string that triggered the run)
# rather than wall-clock minute math: GitHub's scheduler routinely fires late
# (a ~02:00 run can land at 02:27), and a late run still carries its schedule —
# so the daily friction-baseline job can't be missed by a delayed trigger.
# All endpoints are idempotent no-ops when there's no new data.

on:
  schedule:
    - cron: '*/15 * * * *'   # high-frequency: system-health-aggregate + chain-analysis
    - cron: '7,37 * * * *'   # ~2x/hour: skill-threat-update + watch-evaluation + pattern-detection
    - cron: '15 2 * * *'     # daily: friction-baseline-compute + data-archival + agent-expiration
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Endpoints to hit on manual run: "all" or space-separated names'
        default: 'all'

jobs:
  aggregate:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      INGESTION_API_URL: ${{ secrets.INGESTION_API_URL }}
      SCHEDULE: ${{ github.event.schedule }}
      DISPATCH_JOBS: ${{ github.event.inputs.jobs }}
    steps:
      - name: Check secrets configured
        id: check
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$INGESTION_API_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CRON_SECRET or INGESTION_API_URL not set — skipping lens aggregation."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run due lens jobs
        if: steps.check.outputs.configured == 'true'
        run: |
          fail=0
          hit() {
            echo "→ $1"
            body=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $CRON_SECRET" \
              "$INGESTION_API_URL/api/cron/$1")
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            echo "  [$code] $payload"
            case "$code" in
              2*) : ;;
              *) echo "::warning::$1 returned $code"; fail=1 ;;
            esac
          }
          # Decide whether endpoint $1 is due for this trigger.
          due() {
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              [ "${DISPATCH_JOBS:-all}" = "all" ] && return 0
              printf ' %s ' "$DISPATCH_JOBS" | grep -q " $1 "
              return $?
            fi
            case "$SCHEDULE" in
              '*/15 * * * *') case "$1" in system-health-aggregate|chain-analysis) return 0;; esac ;;
              '7,37 * * * *') case "$1" in skill-threat-update|watch-evaluation|pattern-detection|anomaly-correlation) return 0;; esac ;;
              '15 2 * * *')   case "$1" in friction-baseline-compute|data-archival|agent-expiration) return 0;; esac ;;
            esac
            return 1
          }
          # Every handler in cron.ts must appear here (or in anomaly-tick.yml):
          # a cron endpoint with no scheduler is a claim the product doesn't keep
          # (data-archival and agent-expiration back the privacy policy's
          # retention promises; watch-evaluation backs set_watch notifications).
          for job in system-health-aggregate chain-analysis skill-threat-update friction-baseline-compute watch-evaluation pattern-detection anomaly-correlation data-archival agent-expiration; do
            if due "$job"; then hit "$job"; fi
          done
          exit $fail
